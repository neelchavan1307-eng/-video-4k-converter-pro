name: Build Real 4K APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          link-to-sdk: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Fix Old Gradle Project
        run: |
          rm -rf android
          flutter create. --project-name video_4k_converter_pro --platforms=android --no-pub
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 24/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/' android/app/build.gradle

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Real-4K-APK
          path: build/app/outputs/flutter-apk/app-release.apk
