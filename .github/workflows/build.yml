name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Android 35 SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platforms;android-34"

      - run: flutter create  --project-name video_4k_converter  --platforms=android .

      - name: Force compileSdk 35 - हाच खरा Fix
        run: |
          sed -i 's/compileSdk.*/compileSdk 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion.*/compileSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/targetSdk.*/targetSdk 35/' android/app/build.gradle
          sed -i 's/targetSdkVersion.*/targetSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/minSdk.*/minSdk 24/' android/app/build.gradle
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle || true

      - run: flutter clean && flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
