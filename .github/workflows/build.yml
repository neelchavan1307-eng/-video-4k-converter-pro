name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - run: flutter create  --project-name video_4k_converter --platforms=android .
      - run: flutter pub get
      - run: |
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle || true
          sed -i 's/minSdk.*/minSdk 24/' android/app/build.gradle || true
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
