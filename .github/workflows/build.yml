name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - run: flutter create  --project-name video_4k_converter  --platforms=android .
      - run: |
          # Fix Kotlin
          sed -i "s/ext.kotlin_version.*/ext.kotlin_version = '1.9.22'/" android/build.gradle

          # FIX for minSdkVersion ERROR - Add = sign
          sed -i 's/minSdkVersion 24/minSdkVersion = 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = 24/minSdkVersion = 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter/minSdkVersion = flutter/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion.*/minSdkVersion = 24/g' android/app/build.gradle || true
          sed -i 's/minSdk.*/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/minSdk =.*/minSdk = 24/g' android/app/build.gradle || true

          # Force compileSdk 34
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk.*/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk.*/compileSdk = 34/g' android/app/build.gradle || true
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
