name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - run: flutter create  --project-name video_4k_converter  --platforms=android .
      - run: |
          sed -i "s/ext.kotlin_version.*/ext.kotlin_version = '1.9.22'/" android/build.gradle
          sed -i 's/1.7.10/1.9.22/g' android/build.gradle android/app/build.gradle android/settings.gradle || true
          sed -i 's/1.8.22/1.9.22/g' android/build.gradle android/app/build.gradle android/settings.gradle || true
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/compileSdk.*/compileSdk 34/' android/app/build.gradle || true
          sed -i 's/targetSdk.*/targetSdk 34/' android/app/build.gradle || true
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
