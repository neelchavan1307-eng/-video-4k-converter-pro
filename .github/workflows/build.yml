name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: rm -rf android
      - run: flutter create . --platforms=android --project-name video_4k_converter_pro
      - run: |
          sed -i "s/minSdkVersion 21/minSdkVersion 24/g" android/app/build.gradle
          sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 24/g" android/app/build.gradle
          sed -i "s/minSdk flutter.minSdkVersion/minSdk 24/g" android/app/build.gradle
          sed -i "s/ext.kotlin_version = '1.7.10'/ext.kotlin_version = '1.9.22'/g" android/build.gradle
          sed -i "s/ext.kotlin_version = '1.7.1'/ext.kotlin_version = '1.9.22'/g" android/build.gradle
          sed -i "s/kotlin_version = '1.7.10'/kotlin_version = '1.9.22'/g" android/build.gradle
          sed -i "s/id \"org.jetbrains.kotlin.android\" version \"1.7.10\"/id \"org.jetbrains.kotlin.android\" version \"1.9.22\"/g" android/settings.gradle
          sed -i "s/id 'org.jetbrains.kotlin.android' version '1.7.10'/id 'org.jetbrains.kotlin.android' version '1.9.22'/g" android/settings.gradle
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
