name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - run: flutter clean
      - run: flutter pub get

      - name: Fix Android minSdk and packaging
        run: |
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          # Fix build.gradle for ffmpeg
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/' android/app/build.gradle
          # Add packaging options if not exist
          grep -q "packagingOptions" android/app/build.gradle || sed -i '/android {/a \ packagingOptions { pickFirst "**/libc++_shared.so" \n pickFirst "**/libavfilter.so" \n }' android/app/build.gradle

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
