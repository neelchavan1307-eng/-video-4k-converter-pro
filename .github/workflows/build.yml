name: Build 4K APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
      - name: Fix Android Folder
        run: |
          mv lib/main.dart /tmp/main.dart
          mv pubspec.yaml /tmp/pubspec.yaml
          flutter create. --project-name video_4k_converter --platforms android
          mv /tmp/main.dart lib/main.dart
          mv /tmp/pubspec.yaml pubspec.yaml
          flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: 4K-Converter-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
