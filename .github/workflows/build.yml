name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      - run: rm -rf android
      - run: flutter create . --platforms=android --project-name video_4k_converter_pro
      - name: Fix minSdk 24
        run: |
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          sed -i 's/minSdkVersion 21/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion 16/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = 21/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/minSdk.*/minSdk = 24/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk 35/compileSdk 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion 35/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk 35/targetSdk 34/g' android/app/build.gradle || true
          cat android/app/build.gradle | grep -A2 -B2 minSdk
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
