name: video_4k_converter
description: MP4 3GP to 4K Ultra HD Video Converter - Amazing Clarity
publish_to: 'none'
version: 2.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  image_picker: ^1.0.7
  video_player: ^2.8.2
  ffmpeg_kit_flutter: ^6.0.3
  path_provider: ^2.1.2
  share_plus: ^7.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#000000"
    theme_color: "#FFC107"
